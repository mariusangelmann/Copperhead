[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[gateway]
type=endpoint
context=default
disallow=all
allow=ulaw
allow=alaw
auth=gateway-auth
aors=gateway
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[gateway-auth]
type=auth
auth_type=userpass
username=gateway
password=test123

[gateway]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
